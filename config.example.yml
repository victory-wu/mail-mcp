# mail-mcp configuration
#
# Copy to config.yml and configure your Redis connection. This file stays on the
# server — the agent only ever sees an account id, never a hostname it could
# connect to or a password it could use.
#
#   cp config.example.yml config.yml

# ---------------------------------------------------------------------------
# Global gates
#
# Both default to false. An agent can always read, search, organize, and save
# drafts; sending and deleting are opt-in.
# ---------------------------------------------------------------------------

# Allow send_email, reply_email, and forward_email.
# With this false, agents must use create_draft and you send it yourself.
allow_send: false

# Allow delete_email and delete_folder. Even when true, delete_email only
# moves messages to Trash and still requires confirm: true on every call.
allow_delete: false

# Absolute origin used to mint get_attachment download URLs. Required for
# remote agents: file_path is on this host, so they fetch download_url with
# curl instead. Leave empty for stdio. Links expire after 15 minutes.
# public_url: https://mail-mcp.example.com

# Close pooled IMAP connections after this much time without access. The
# cleanup task runs in the background and never interrupts an active command.
idle_connection_timeout: 24h

# ---------------------------------------------------------------------------
# Limits — bound what a single tool call can cost
# ---------------------------------------------------------------------------
limits:
  # Truncate each body part to this many characters. Bodies are the main way
  # an agent's context gets eaten.
  max_body_chars: 50000

  # Largest page search_emails will return.
  max_search_results: 100

  # Refuse to download or attach anything bigger than this.
  max_attachment_bytes: 26214400 # 25 MiB

  # Where get_attachment writes files. Defaults to the system temp directory.
  # attachment_dir: /var/lib/mail-mcp/attachments

# ---------------------------------------------------------------------------
# Timeouts — every network operation is bounded
# ---------------------------------------------------------------------------
timeouts:
  imap_connect: 30s
  imap_command: 60s
  smtp_connect: 30s
  # Generous: this covers DATA transmission, and a large attachment on a slow
  # uplink legitimately takes minutes.
  smtp_send: 5m

# ---------------------------------------------------------------------------
# Account store — accounts are loaded from the mcp_accounts Redis hash.
# Field: caller hostname-login email-UUID v4; value: account JSON (see README).
# Enable management APIs with --accounts-api-key or ACCOUNTS_API_KEY.
# Management APIs read/write Redis immediately; restart for MCP tools to reload.
# ---------------------------------------------------------------------------
redis:
  addr: 127.0.0.1:6379
  # username: default
  # password: your-redis-password
  db: 0
  timeout: 10s
